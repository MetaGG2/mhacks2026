<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebHound options</title>
    <style>
      :root,
      :root[data-theme="dark"],
      :root[data-theme="system"] {
        color-scheme: dark;
        --green: #315e52;
        --white: #ffffff;
        --light-gray: #d9d9d9;
        --dark-gray: #333333;
        --black: #000000;
        --bg: var(--black);
        --card: var(--dark-gray);
        --border: var(--light-gray);
        --title: var(--white);
        --muted: var(--light-gray);
        --field: var(--black);
        --accent: var(--green);
        --note: var(--light-gray);
        --button: var(--white);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: var(--light-gray);
        --card: var(--white);
        --border: var(--dark-gray);
        --title: var(--black);
        --muted: var(--dark-gray);
        --field: var(--light-gray);
        --accent: var(--green);
        --note: var(--dark-gray);
        --button: var(--white);
      }
      @media (prefers-color-scheme: light) {
        :root[data-theme="system"] {
          color-scheme: light;
          --bg: var(--light-gray);
          --card: var(--white);
          --border: var(--dark-gray);
          --title: var(--black);
          --muted: var(--dark-gray);
          --field: var(--light-gray);
          --accent: var(--green);
          --note: var(--dark-gray);
          --button: var(--white);
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--title);
        font-family: Inter, system-ui, sans-serif;
        display: flex;
        justify-content: center;
        padding: 48px 16px;
      }
      .card {
        width: min(440px, 100%);
        background: var(--bg);
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        background: var(--field);
        border: 1px solid var(--border);
        color: var(--title);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13px;
        font-family: inherit;
      }
      select {
        appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
          linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position:
          calc(100% - 18px) 50%,
          calc(100% - 12px) 50%;
        background-size:
          6px 6px,
          6px 6px;
        background-repeat: no-repeat;
      }
      .field {
        margin-bottom: 16px;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        cursor: pointer;
      }
      .checkbox input {
        width: auto;
        margin: 0;
        accent-color: var(--accent);
      }
      .note {
        margin: 8px 0 0;
        font-size: 12px;
        line-height: 1.4;
        color: var(--note);
      }
      button {
        margin-top: 4px;
        background: var(--accent);
        color: var(--button);
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        color: var(--note);
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>WebHound</h1>
      <p id="intro">
        All WebHound settings are available from the settings cog in the
        WebHound popup.
      </p>
    </main>
  </body>
</html>
